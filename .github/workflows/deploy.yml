name: Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Publicar no servidor
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Substituir credenciais do banco
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          sed -i "s|private string \$host = .*;|private string \$host = \"$DB_HOST\";|" classes/banco.php
          sed -i "s|private string \$banco = .*;|private string \$banco = \"$DB_NAME\";|" classes/banco.php
          sed -i "s|private string \$usuario = .*;|private string \$usuario = \"$DB_USER\";|" classes/banco.php
          sed -i "s|private string \$senha = .*;|private string \$senha = \"$DB_PASS\";|" classes/banco.php

      - name: Publicar via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /estudae.totalh.net/htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/database/**
